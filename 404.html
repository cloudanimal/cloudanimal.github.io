<style>
  :root { --paper:#faf9f7; --ink:#1c1d1f; --soft:#5c6066; --line:#e4e2dd; --accent:#28415d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .code { font-family: "Newsreader", serif; font-size: 90px; font-weight: 400; letter-spacing: -2px; color: var(--accent); line-height: 1; }
  h1 { font-family: "Newsreader", serif; font-weight: 400; font-style: italic; font-size: 26px; margin-top: 14px; }
  p { color: var(--soft); font-size: 15px; margin-top: 12px; }
  a { display: inline-block; margin-top: 28px; font-size: 14.5px; font-weight: 500; text-decoration: none; color: var(--paper); background: var(--ink); padding: 12px 24px; border-radius: 100px; transition: background .2s ease; }
  a:hover { background: var(--accent); }
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>This page wandered off.</h1>
    <p>The link may be broken, or the page may have moved.</p>

  </div>
</body>
